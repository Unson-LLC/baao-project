<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
  <title id="title">MCPでつなぎ、Brainbaseで文脈化し、Agentが仕事を進める</title>
  <desc id="desc">Mail、Teams、DriveをMCPでBrainbaseへ接続し、RAG、Graph、個人KG、OntologyからAgentが文脈を受け、人の承認後に業務へ書き戻す循環図</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#071B50" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#071B50"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#04AFC4"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7A00"/>
    </marker>
    <style>
      .jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
      .navy{fill:#071B50}.muted{fill:#5D6988}.white{fill:#fff}
      .label{font-size:17px;font-weight:700;letter-spacing:.06em}
      .small{font-size:15px;font-weight:600}.tiny{font-size:13px;font-weight:600}
      .cardTitle{font-size:22px;font-weight:800}.body{font-size:16px;font-weight:600}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1664" height="936" fill="#F8FAFD"/>
  <rect x="58" y="44" width="58" height="6" rx="3" fill="#FF7A00"/>
  <text class="jp navy" x="58" y="105" font-size="42" font-weight="900">MCPでつなぎ、Brainbaseで文脈化し、Agentが仕事を進める</text>
  <text class="jp muted" x="60" y="140" font-size="18" font-weight="600">検索できる状態から、関係・判断・意味を持った組織知へ。そして、承認された次の行動へ。</text>

  <!-- stage headers -->
  <g class="jp">
    <text x="78" y="190" class="label" fill="#6B2CBF">01  CONNECT</text>
    <text x="354" y="190" class="label" fill="#04AFC4">02  MCP</text>
    <text x="535" y="190" class="label" fill="#1785E5">03  CONTEXT</text>
    <text x="1244" y="190" class="label" fill="#FF7A00">04  ACT</text>
  </g>

  <!-- apps column -->
  <g filter="url(#softShadow)">
    <rect x="58" y="216" width="250" height="474" rx="24" fill="#FFFFFF" stroke="#D9E1EF" stroke-width="2"/>
  </g>
  <text class="jp navy cardTitle" x="86" y="258">業務の記録</text>
  <text class="jp muted small" x="86" y="285">すでに毎日の仕事に残っている</text>

  <!-- Mail card -->
  <g>
    <rect x="82" y="316" width="202" height="92" rx="16" fill="#FBF8FF" stroke="#DCCAF4" stroke-width="2"/>
    <rect x="102" y="340" width="48" height="34" rx="5" fill="none" stroke="#6B2CBF" stroke-width="3"/>
    <path d="M103 343 L126 360 L149 343" class="line" stroke="#6B2CBF" stroke-width="3"/>
    <text class="jp navy" x="168" y="351" font-size="20" font-weight="800">Mail</text>
    <text class="jp muted" x="168" y="377" font-size="14" font-weight="600">相談・依頼・判断</text>
  </g>
  <!-- Teams card -->
  <g>
    <rect x="82" y="426" width="202" height="92" rx="16" fill="#F4FBFD" stroke="#BFEAF0" stroke-width="2"/>
    <circle cx="116" cy="459" r="12" fill="none" stroke="#04AFC4" stroke-width="3"/>
    <path d="M96 489 C98 474 106 468 116 468 C126 468 134 474 136 489" class="line" stroke="#04AFC4" stroke-width="3"/>
    <path d="M137 447 h21 a8 8 0 0 1 8 8 v12 a8 8 0 0 1-8 8 h-7 l-8 7 v-7 h-7" class="line" stroke="#04AFC4" stroke-width="3"/>
    <text class="jp navy" x="174" y="461" font-size="20" font-weight="800">Teams</text>
    <text class="jp muted" x="174" y="487" font-size="14" font-weight="600">会議・チャット</text>
  </g>
  <!-- Drive card -->
  <g>
    <rect x="82" y="536" width="202" height="92" rx="16" fill="#F3F8FF" stroke="#C5DCF5" stroke-width="2"/>
    <path d="M104 565 h20 l7 8 h28 v30 h-55 z" fill="none" stroke="#1785E5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M105 574 h53" class="line" stroke="#1785E5" stroke-width="3"/>
    <text class="jp navy" x="174" y="571" font-size="20" font-weight="800">Drive</text>
    <text class="jp muted" x="174" y="597" font-size="14" font-weight="600">資料・議事録・成果物</text>
  </g>
  <text class="jp muted tiny" x="89" y="658">必要に応じて業務DB・SaaSも接続</text>

  <!-- MCP gateway -->
  <g filter="url(#softShadow)">
    <rect x="354" y="263" width="136" height="364" rx="28" fill="#071B50"/>
  </g>
  <circle cx="422" cy="324" r="35" fill="#0D2A68" stroke="#04AFC4" stroke-width="2"/>
  <path d="M405 324 h34 M413 313 v22 M431 313 v22" class="line" stroke="#FFFFFF" stroke-width="3"/>
  <text class="jp white" x="422" y="384" text-anchor="middle" font-size="31" font-weight="900">MCP</text>
  <text class="jp" x="422" y="418" text-anchor="middle" fill="#8EE5EF" font-size="15" font-weight="700">共通接続レイヤー</text>
  <line x1="382" y1="443" x2="462" y2="443" stroke="#33508B" stroke-width="1.5"/>
  <g class="jp white" font-size="15" font-weight="700" text-anchor="middle">
    <text x="422" y="481">認証・権限</text>
    <text x="422" y="516">読み取り</text>
    <text x="422" y="551">書き戻し</text>
    <text x="422" y="586">監査可能な接続</text>
  </g>

  <!-- source to MCP and MCP to Brainbase -->
  <path d="M308 351 H344" class="line" stroke="#6B2CBF" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M308 462 H344" class="line" stroke="#04AFC4" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <path d="M308 573 H344" class="line" stroke="#1785E5" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M490 382 H525" class="line" stroke="#071B50" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <text class="jp muted tiny" x="507" y="365" text-anchor="middle">取得</text>

  <!-- Brainbase -->
  <g filter="url(#softShadow)">
    <rect x="526" y="216" width="674" height="474" rx="28" fill="#FFFFFF" stroke="#BFD0EC" stroke-width="2"/>
  </g>
  <rect x="526" y="216" width="674" height="78" rx="28" fill="#071B50"/>
  <path d="M526 270 V244 Q526 216 554 216 H1172 Q1200 216 1200 244 V270" fill="#071B50"/>
  <text class="jp white" x="558" y="254" font-size="28" font-weight="900">Brainbase</text>
  <text class="jp" x="558" y="279" fill="#A7DDE5" font-size="15" font-weight="700">組織の文脈を置く知識基盤</text>
  <rect x="1050" y="239" width="116" height="34" rx="17" fill="#13316F" stroke="#31518D"/>
  <text class="jp white" x="1108" y="262" text-anchor="middle" font-size="13" font-weight="700">CONTEXT LAYER</text>

  <!-- three knowledge modules -->
  <g>
    <rect x="554" y="326" width="190" height="188" rx="22" fill="#F2F7FE" stroke="#1785E5" stroke-width="2.5"/>
    <!-- graph icon -->
    <path d="M601 375 L633 356 L669 378 L651 414 L610 410 Z" class="line" stroke="#1785E5" stroke-width="2.5"/>
    <circle cx="601" cy="375" r="7" fill="#FFFFFF" stroke="#1785E5" stroke-width="2.5"/>
    <circle cx="633" cy="356" r="7" fill="#FFFFFF" stroke="#1785E5" stroke-width="2.5"/>
    <circle cx="669" cy="378" r="7" fill="#FFFFFF" stroke="#1785E5" stroke-width="2.5"/>
    <circle cx="651" cy="414" r="7" fill="#FFFFFF" stroke="#1785E5" stroke-width="2.5"/>
    <circle cx="610" cy="410" r="7" fill="#FFFFFF" stroke="#1785E5" stroke-width="2.5"/>
    <text class="jp navy" x="649" y="452" text-anchor="middle" font-size="22" font-weight="900">Graph SSOT</text>
    <text class="jp muted" x="649" y="479" text-anchor="middle" font-size="14" font-weight="650">人・案件・判断・関係</text>
    <rect x="614" y="490" width="70" height="20" rx="10" fill="#DDEEFF"/>
    <text class="jp" x="649" y="504" text-anchor="middle" fill="#176AB4" font-size="11" font-weight="800">確認済み</text>
  </g>

  <g>
    <rect x="766" y="326" width="190" height="188" rx="22" fill="#FBF7FF" stroke="#6B2CBF" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- personal KG icon -->
    <circle cx="841" cy="369" r="19" fill="none" stroke="#6B2CBF" stroke-width="2.7"/>
    <path d="M804 419 C807 391 822 382 841 382 C860 382 875 391 878 419" class="line" stroke="#6B2CBF" stroke-width="2.7"/>
    <circle cx="887" cy="366" r="7" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="2.4"/>
    <circle cx="898" cy="395" r="7" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="2.4"/>
    <path d="M865 382 L887 366 L898 395 L873 407" class="line" stroke="#6B2CBF" stroke-width="2.2"/>
    <text class="jp navy" x="861" y="452" text-anchor="middle" font-size="22" font-weight="900">個人KG</text>
    <text class="jp muted" x="861" y="479" text-anchor="middle" font-size="14" font-weight="650">経験・判断基準・文脈</text>
    <rect x="820" y="490" width="82" height="20" rx="10" fill="#F0E4FF"/>
    <text class="jp" x="861" y="504" text-anchor="middle" fill="#6B2CBF" font-size="11" font-weight="800">実装進行中</text>
  </g>

  <g>
    <rect x="978" y="326" width="190" height="188" rx="22" fill="#FFF9F2" stroke="#FF7A00" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- ontology icon -->
    <rect x="1040" y="350" width="66" height="34" rx="9" fill="#FFFFFF" stroke="#FF7A00" stroke-width="2.5"/>
    <rect x="1006" y="408" width="57" height="34" rx="9" fill="#FFFFFF" stroke="#FF7A00" stroke-width="2.5"/>
    <rect x="1084" y="408" width="57" height="34" rx="9" fill="#FFFFFF" stroke="#FF7A00" stroke-width="2.5"/>
    <path d="M1073 384 V397 M1035 397 H1113 M1035 397 V408 M1113 397 V408" class="line" stroke="#FF7A00" stroke-width="2.5"/>
    <text class="jp navy" x="1073" y="466" text-anchor="middle" font-size="22" font-weight="900">Ontology</text>
    <text class="jp muted" x="1073" y="491" text-anchor="middle" font-size="14" font-weight="650">共通語彙・型・ルール</text>
    <rect x="1035" y="496" width="76" height="20" rx="10" fill="#FFE9D2"/>
    <text class="jp" x="1073" y="510" text-anchor="middle" fill="#C85A00" font-size="11" font-weight="800">発展構想</text>
  </g>

  <!-- RAG foundation -->
  <rect x="554" y="542" width="614" height="80" rx="18" fill="#F1FBFC" stroke="#04AFC4" stroke-width="2"/>
  <circle cx="597" cy="582" r="20" fill="#FFFFFF" stroke="#04AFC4" stroke-width="2.4"/>
  <circle cx="592" cy="577" r="8" fill="none" stroke="#04AFC4" stroke-width="2.4"/>
  <path d="M598 583 L607 592" class="line" stroke="#04AFC4" stroke-width="2.4"/>
  <text class="jp navy" x="632" y="575" font-size="19" font-weight="900">RAG／情報検索</text>
  <text class="jp muted" x="632" y="600" font-size="14" font-weight="650">原文と出典へ戻れる検索の土台</text>
  <path d="M649 542 V526" class="line" stroke="#04AFC4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M861 542 V526" class="line" stroke="#04AFC4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M1073 542 V526" class="line" stroke="#04AFC4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="936" y="560" width="205" height="42" rx="12" fill="#FFFFFF" stroke="#BFE8ED"/>
  <text class="jp" x="1038" y="578" text-anchor="middle" fill="#087F8D" font-size="12" font-weight="800">CONTEXT PACK</text>
  <text class="jp muted" x="1038" y="595" text-anchor="middle" font-size="11" font-weight="700">根拠・関係・判断・権限</text>
  <text class="jp muted tiny" x="560" y="654">点線の領域は、現在の実装を踏まえた発展レイヤー</text>

  <!-- Brainbase to Agent -->
  <path d="M1200 382 H1232" class="line" stroke="#071B50" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <text class="jp muted tiny" x="1217" y="365" text-anchor="middle">文脈</text>

  <!-- Agent column -->
  <g filter="url(#softShadow)">
    <rect x="1234" y="216" width="370" height="474" rx="28" fill="#071B50"/>
  </g>
  <text class="jp white" x="1266" y="258" font-size="28" font-weight="900">Agent</text>
  <text class="jp" x="1266" y="283" fill="#A8B9DF" font-size="15" font-weight="700">文脈を使って、仕事の次手をつくる</text>
  <!-- agent brain -->
  <circle cx="1535" cy="258" r="25" fill="#13316F" stroke="#FF7A00" stroke-width="2"/>
  <path d="M1522 259 C1517 247 1528 239 1536 246 C1544 238 1555 247 1549 258 C1557 266 1548 277 1538 271 C1530 279 1518 271 1524 262" class="line" stroke="#FFFFFF" stroke-width="2.2"/>

  <g>
    <rect x="1264" y="316" width="310" height="78" rx="16" fill="#102C68" stroke="#294A89"/>
    <circle cx="1303" cy="355" r="19" fill="#163A7D"/>
    <path d="M1294 357 h18 M1303 348 v18" class="line" stroke="#8EDCE6" stroke-width="2.4"/>
    <text class="jp white" x="1336" y="348" font-size="18" font-weight="850">調査 Agent</text>
    <text class="jp" x="1336" y="373" fill="#B9C7E4" font-size="13" font-weight="650">必要な情報と根拠を集める</text>
  </g>
  <g>
    <rect x="1264" y="411" width="310" height="78" rx="16" fill="#102C68" stroke="#294A89"/>
    <circle cx="1303" cy="450" r="19" fill="#163A7D"/>
    <path d="M1292 453 L1300 461 L1315 440" class="line" stroke="#C5A6F2" stroke-width="2.8"/>
    <text class="jp white" x="1336" y="443" font-size="18" font-weight="850">判断支援 Agent</text>
    <text class="jp" x="1336" y="468" fill="#B9C7E4" font-size="13" font-weight="650">選択肢・論点・リスクを整理する</text>
  </g>
  <g>
    <rect x="1264" y="506" width="310" height="78" rx="16" fill="#102C68" stroke="#294A89"/>
    <circle cx="1303" cy="545" r="19" fill="#163A7D"/>
    <path d="M1294 546 h17 M1306 540 l6 6 l-6 6" class="line" stroke="#FFB25B" stroke-width="2.6"/>
    <text class="jp white" x="1336" y="538" font-size="18" font-weight="850">実行 Agent</text>
    <text class="jp" x="1336" y="563" fill="#B9C7E4" font-size="13" font-weight="650">下書き・通知・タスク候補をつくる</text>
  </g>
  <rect x="1264" y="607" width="310" height="54" rx="16" fill="#FFF5E8" stroke="#FF7A00" stroke-width="2"/>
  <path d="M1288 634 l7 7 l14-17" class="line" stroke="#FF7A00" stroke-width="2.8"/>
  <text class="jp" x="1322" y="630" fill="#9E4300" font-size="14" font-weight="850">人が承認・修正・停止</text>
  <text class="jp" x="1322" y="649" fill="#A66B3F" font-size="11" font-weight="700">権限と監査ログを残して実行</text>

  <!-- write-back loop -->
  <path d="M1424 690 V742 H422 V640" class="line" stroke="#FF7A00" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>
  <rect x="702" y="720" width="420" height="44" rx="22" fill="#FFF8F0" stroke="#FFD2A5"/>
  <text class="jp" x="912" y="747" text-anchor="middle" fill="#B64D00" font-size="15" font-weight="850">承認後：Mail送信／Teams投稿／Drive更新／タスク登録</text>
  <path d="M354 742 H164 V704" class="line" stroke="#FF7A00" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>

  <!-- bottom statement -->
  <line x1="58" y1="817" x2="1606" y2="817" stroke="#CBD5E6" stroke-width="1.5"/>
  <circle cx="96" cy="862" r="24" fill="#071B50"/>
  <path d="M86 863 l7 7 l14-18" class="line" stroke="#FFFFFF" stroke-width="3"/>
  <text class="jp navy" x="136" y="856" font-size="22" font-weight="900">ナレッジのゴールは「探せること」ではない。</text>
  <text class="jp" x="136" y="888" fill="#344260" font-size="19" font-weight="700">人とAIが、同じ文脈から次の判断を進められる状態をつくる。</text>
  <text class="jp muted" x="1605" y="891" text-anchor="end" font-size="12" font-weight="650">BAAO × NEC｜第3回 構想図</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
  <title id="title">Ontology Kernelで制御する、安全な知識とAgentの循環</title>
  <desc id="desc">Mail、Teams、DriveからMCPを経由して証拠と個人文脈を取得し、Agentの提案をOntology Kernelで検証し、Human Gate承認後にGraph SSOTへ公開して業務へ書き戻す循環図</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#071B50" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#071B50" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#071B50"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#FF7A00"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#04AFC4"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B2CBF"/></marker>
    <style>
      .jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
      .navy{fill:#071B50}.muted{fill:#5D6988}.white{fill:#fff}.orange{fill:#FF7A00}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .label{font-size:12px;font-weight:750}.small{font-size:10.5px;font-weight:700}
    </style>
  </defs>

  <rect width="1664" height="936" fill="#F8FAFD"/>
  <image href="04-ontology-kernel-hero-art-base.png" x="0" y="0" width="1664" height="936" preserveAspectRatio="none"/>

  <!-- editorial title band -->
  <rect x="0" y="0" width="1664" height="154" fill="#F8FAFD" fill-opacity="0.96"/>
  <rect x="58" y="38" width="58" height="6" rx="3" fill="#FF7A00"/>
  <text class="jp navy" x="58" y="88" font-size="35" font-weight="900">Ontology Kernelで制御する、安全な知識とAgentの循環</text>
  <text class="jp muted" x="59" y="124" font-size="16" font-weight="700">情報を集めるだけではない。意味を検証し、人が承認した事実と実行だけを正本へ戻す。</text>

  <!-- source glass -->
  <g filter="url(#shadow)">
    <rect x="50" y="184" width="248" height="296" rx="24" fill="#FFFFFF" fill-opacity="0.93" stroke="#D4DDEA" stroke-width="1.5"/>
  </g>
  <text class="jp" x="74" y="221" fill="#6B2CBF" font-size="13" font-weight="900">01  SOURCES</text>
  <text class="jp navy" x="74" y="254" font-size="22" font-weight="900">業務の正本</text>
  <text class="jp muted label" x="74" y="277">原文・会話・成果物は残す</text>

  <g class="jp">
    <rect x="72" y="297" width="204" height="48" rx="14" fill="#FBF8FF" stroke="#D9C2F3"/>
    <path d="M89 314 h28 v19 h-28 z M90 315 l13 10 l13-10" class="line" stroke="#6B2CBF" stroke-width="2"/>
    <text x="130" y="328" class="navy" font-size="15" font-weight="900">Mail</text><text x="185" y="328" class="muted" font-size="10.5" font-weight="700">相談・依頼・判断</text>
    <rect x="72" y="355" width="204" height="48" rx="14" fill="#F2FBFD" stroke="#BFEAF0"/>
    <circle cx="100" cy="375" r="7" fill="none" stroke="#04AFC4" stroke-width="2"/><path d="M88 395 C89 384 94 380 100 380 C107 380 112 384 113 395 M115 369 h15 v13 h-8 l-7 6" class="line" stroke="#04AFC4" stroke-width="2"/>
    <text x="140" y="386" class="navy" font-size="15" font-weight="900">Teams</text><text x="205" y="386" class="muted" font-size="10" font-weight="700">会議・チャット</text>
    <rect x="72" y="413" width="204" height="48" rx="14" fill="#F3F8FF" stroke="#C5DCF5"/>
    <path d="M89 430 h14 l5 6 h19 v14 h-38 z" fill="none" stroke="#1785E5" stroke-width="2" stroke-linejoin="round"/>
    <text x="140" y="444" class="navy" font-size="15" font-weight="900">Drive</text><text x="195" y="444" class="muted" font-size="10.5" font-weight="700">資料・議事録</text>
  </g>

  <!-- MCP gateway -->
  <g filter="url(#shadow)">
    <rect x="328" y="274" width="116" height="151" rx="28" fill="#071B50"/>
  </g>
  <circle cx="386" cy="312" r="20" fill="#0D2A68" stroke="#04AFC4" stroke-width="2"/>
  <path d="M375 312 h22 M380 304 v16 M392 304 v16" class="line" stroke="#FFFFFF" stroke-width="2.4"/>
  <text class="jp white" x="386" y="357" text-anchor="middle" font-size="24" font-weight="900">MCP</text>
  <text class="jp" x="386" y="379" text-anchor="middle" fill="#8EE5EF" font-size="10.5" font-weight="800">認証・権限・監査</text>
  <text class="jp" x="386" y="401" text-anchor="middle" fill="#B9C7E4" font-size="10" font-weight="700">読み取り／書き戻し</text>

  <!-- deterministic input directions -->
  <path d="M298 351 H321" class="line" stroke="#071B50" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <text class="jp muted small" x="310" y="339" text-anchor="middle">接続</text>
  <path d="M328 438 H303" class="line" stroke="#FF7A00" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="jp" x="315" y="458" text-anchor="middle" fill="#B45300" font-size="9.5" font-weight="850">書戻し</text>
  <path d="M444 347 C498 347 538 377 612 406" class="line" stroke="#04AFC4" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <rect x="470" y="301" width="160" height="53" rx="16" fill="#FFFFFF" fill-opacity="0.91" stroke="#04AFC4" filter="url(#soft)"/>
  <text class="jp navy" x="550" y="326" text-anchor="middle" font-size="15" font-weight="900">RAG / Evidence</text>
  <text class="jp muted small" x="550" y="344" text-anchor="middle">原文と出典へ戻る</text>

  <path d="M444 390 C500 482 552 600 662 650" class="line" stroke="#6B2CBF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowPurple)"/>
  <rect x="414" y="625" width="202" height="60" rx="17" fill="#FFFFFF" fill-opacity="0.92" stroke="#6B2CBF" stroke-dasharray="7 5" filter="url(#soft)"/>
  <text class="jp navy" x="515" y="652" text-anchor="middle" font-size="16" font-weight="900">Personal KG</text>
  <text class="jp" x="515" y="673" text-anchor="middle" fill="#6B2CBF" font-size="10.5" font-weight="800">候補・参照／自動昇格しない</text>

  <!-- Brainbase central hero labels -->
  <rect x="714" y="160" width="309" height="46" rx="23" fill="#FF7A00" filter="url(#soft)"/>
  <text class="jp white" x="868" y="190" text-anchor="middle" font-size="21" font-weight="900">Ontology Kernel</text>
  <text class="jp" x="868" y="220" text-anchor="middle" fill="#9E4300" font-size="11" font-weight="800">Graphの事実を守る意味契約</text>

  <g class="jp" filter="url(#soft)">
    <rect x="543" y="222" width="176" height="50" rx="15" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFD0A0"/>
    <text x="631" y="246" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">意味・型</text><text x="631" y="263" text-anchor="middle" fill="#6B6470" font-size="9.5" font-weight="700">同一性・関係語彙</text>
    <rect x="1018" y="222" width="176" height="50" rx="15" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFD0A0"/>
    <text x="1106" y="246" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">書込前検証</text><text x="1106" y="263" text-anchor="middle" fill="#6B6470" font-size="9.5" font-weight="700">制約・dry-run</text>
    <rect x="543" y="688" width="176" height="50" rx="15" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFD0A0"/>
    <text x="631" y="712" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">根拠付き推論</text><text x="631" y="729" text-anchor="middle" fill="#6B6470" font-size="9.5" font-weight="700">規則ID・根拠・時刻</text>
    <rect x="1018" y="688" width="176" height="50" rx="15" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFD0A0"/>
    <text x="1106" y="712" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">版・変更管理</text><text x="1106" y="729" text-anchor="middle" fill="#6B6470" font-size="9.5" font-weight="700">適用日・移行・rollback</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="756" y="397" width="224" height="94" rx="24" fill="#FFFFFF" fill-opacity="0.90" stroke="#1785E5" stroke-width="2"/>
  </g>
  <text class="jp navy" x="868" y="435" text-anchor="middle" font-size="22" font-weight="900">Graph SSOT</text>
  <text class="jp muted" x="868" y="458" text-anchor="middle" font-size="10.5" font-weight="700">人・組織・案件・Decision・RACI</text>
  <rect x="800" y="469" width="136" height="17" rx="8.5" fill="#DDEEFF"/>
  <text class="jp" x="868" y="481" text-anchor="middle" fill="#176AB4" font-size="9" font-weight="850">承認後にcanonical公開</text>

  <!-- exact proposal / validation / human gate directions -->
  <rect x="1320" y="283" width="270" height="105" rx="24" fill="#071B50" fill-opacity="0.93" stroke="#294A89" filter="url(#shadow)"/>
  <text class="jp white" x="1350" y="321" font-size="22" font-weight="900">Agent</text>
  <text class="jp" x="1350" y="346" fill="#B9C7E4" font-size="11" font-weight="700">調査・判断支援・提案</text>
  <text class="jp" x="1350" y="368" fill="#8EE5EF" font-size="10.5" font-weight="800">Role・Tool・Workflowを持つ</text>

  <path d="M1320 339 C1268 339 1232 355 1176 381" class="line" stroke="#071B50" stroke-width="3.5" marker-end="url(#arrowNavy)"/>
  <text class="jp navy" x="1248" y="323" text-anchor="middle" font-size="10.5" font-weight="850">① Agent proposal</text>

  <rect x="1110" y="476" width="178" height="58" rx="18" fill="#FFF7EF" fill-opacity="0.96" stroke="#FF7A00" stroke-width="2" filter="url(#soft)"/>
  <path d="M1131 505 l7 7 l13-18" class="line" stroke="#FF7A00" stroke-width="2.5"/>
  <text class="jp" x="1162" y="500" fill="#B45300" font-size="14" font-weight="900">Human Gate</text>
  <text class="jp muted small" x="1162" y="520">承認者・resolution・監査</text>

  <path d="M1075 450 C1120 450 1140 465 1166 475" class="line" stroke="#FF7A00" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="jp" x="1110" y="438" text-anchor="middle" fill="#B45300" font-size="10.5" font-weight="850">② 適合 → 人の承認</text>
  <path d="M1110 518 C1060 551 1017 548 975 516" class="line" stroke="#1785E5" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <text class="jp" x="1038" y="543" text-anchor="middle" fill="#176AB4" font-size="10.5" font-weight="850">③ 承認後にGraph公開</text>

  <!-- outcomes, deliberately separate from canonical path -->
  <rect x="713" y="550" width="438" height="47" rx="16" fill="#FFFFFF" fill-opacity="0.91" stroke="#FFD0A0"/>
  <g class="jp" font-size="10.5" font-weight="850">
    <circle cx="738" cy="574" r="11" fill="#E5F7F1"/><path d="M732 574 l4 4 l8-10" class="line" stroke="#158667" stroke-width="2"/><text x="756" y="578" fill="#246C58">適合：Human Gateへ</text>
    <circle cx="886" cy="574" r="11" fill="#FFF0E0"/><path d="M880 568 l12 12 M892 568 l-12 12" class="line" stroke="#D35B00" stroke-width="2"/><text x="904" y="578" fill="#9E4300">違反：拒否・隔離</text>
    <circle cx="1028" cy="574" r="11" fill="#F2EDFA"/><text x="1028" y="578" text-anchor="middle" fill="#6B2CBF">?</text><text x="1046" y="578" fill="#5A3B86">不足：競合・未確認</text>
  </g>
  <text class="jp" x="868" y="619" text-anchor="middle" fill="#9E4300" font-size="10.5" font-weight="800">Story: active／受け入れ基準: 未完了／active Ontology version: 未確認</text>

  <!-- execution and write-back loop -->
  <rect x="1330" y="594" width="258" height="71" rx="20" fill="#071B50" fill-opacity="0.93" stroke="#294A89" filter="url(#shadow)"/>
  <text class="jp white" x="1355" y="623" font-size="17" font-weight="900">Automation Run</text>
  <text class="jp" x="1355" y="646" fill="#B9C7E4" font-size="10.5" font-weight="700">step・state・retry・output・audit</text>
  <path d="M1288 511 C1340 526 1404 548 1438 588" class="line" stroke="#FF7A00" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text class="jp" x="1374" y="535" fill="#B45300" font-size="10.5" font-weight="850">④ 承認された実行</text>
  <path d="M1458 665 V749 H386 V432" class="line" stroke="#FF7A00" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowOrange)"/>
  <rect x="677" y="726" width="354" height="43" rx="21.5" fill="#FFF7EF" fill-opacity="0.96" stroke="#FFD0A0"/>
  <text class="jp" x="854" y="753" text-anchor="middle" fill="#B45300" font-size="12" font-weight="900">⑤ MCP経由でMail・Teams・Driveへ書き戻す</text>

  <!-- lifecycle -->
  <rect x="0" y="779" width="1664" height="157" fill="#F8FAFD" fill-opacity="0.96"/>
  <text class="jp navy" x="58" y="814" font-size="16" font-weight="900">Ontology変更は、提案から公開まで証跡を残す</text>
  <line x1="120" y1="853" x2="1518" y2="853" stroke="#C8D3E5" stroke-width="2"/>
  <g class="jp" text-anchor="middle">
    <g><circle cx="184" cy="853" r="14" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="3"/><text x="184" y="858" fill="#6B2CBF" font-size="12" font-weight="900">1</text><text x="184" y="886" class="navy" font-size="12" font-weight="850">規則を提案</text></g>
    <path d="M199 853 H438" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <g><circle cx="459" cy="853" r="14" fill="#FFFFFF" stroke="#1785E5" stroke-width="3"/><text x="459" y="858" fill="#1785E5" font-size="12" font-weight="900">2</text><text x="459" y="886" class="navy" font-size="12" font-weight="850">Impact Report</text></g>
    <path d="M474 853 H720" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <g><circle cx="742" cy="853" r="14" fill="#FFFFFF" stroke="#FF7A00" stroke-width="3"/><text x="742" y="858" fill="#D35B00" font-size="12" font-weight="900">3</text><text x="742" y="886" class="navy" font-size="12" font-weight="850">Decision / RACI承認</text></g>
    <path d="M757 853 H1037" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <g><circle cx="1059" cy="853" r="14" fill="#FFFFFF" stroke="#04AFC4" stroke-width="3"/><text x="1059" y="858" fill="#078A99" font-size="12" font-weight="900">4</text><text x="1059" y="886" class="navy" font-size="12" font-weight="850">active version公開</text></g>
    <path d="M1074 853 H1364" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <g><circle cx="1386" cy="853" r="14" fill="#FFFFFF" stroke="#071B50" stroke-width="3"/><text x="1386" y="858" fill="#071B50" font-size="12" font-weight="900">5</text><text x="1386" y="886" class="navy" font-size="12" font-weight="850">移行 / rollback</text></g>
  </g>
  <circle cx="72" cy="914" r="13" fill="#071B50"/><path d="M65 914 l5 5 l10-13" class="line" stroke="#FFFFFF" stroke-width="2.4"/>
  <text class="jp navy" x="98" y="919" font-size="15" font-weight="900">Ontologyは知識を置く箱ではない。Graphを同じ意味で解釈し、誤った関係を正本へ入れないための契約である。</text>
</svg>

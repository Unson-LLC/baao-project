<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
  <title id="title">MCPでつなぎ、Ontology Kernelで意味を揃え、Agentが安全に仕事を進める</title>
  <desc id="desc">Mail、Teams、DriveをMCPでつなぎ、RAG、Personal KG、Graph SSOT、Ontology Kernel、Agent、Automation Run、Human Gate、DecisionとRACIの関係を示す構成図</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#071B50" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#071B50"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#04AFC4"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#FF7A00"/></marker>
    <style>
      .jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
      .navy{fill:#071B50}.muted{fill:#5D6988}.white{fill:#fff}.orange{fill:#FF7A00}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .stage{font-size:16px;font-weight:800;letter-spacing:.06em}
      .h2{font-size:25px;font-weight:900}.h3{font-size:19px;font-weight:850}
      .body{font-size:14px;font-weight:650}.small{font-size:12px;font-weight:650}.tiny{font-size:10.5px;font-weight:700}
    </style>
  </defs>

  <rect width="1664" height="936" fill="#F8FAFD"/>
  <rect x="58" y="42" width="58" height="6" rx="3" fill="#FF7A00"/>
  <text class="jp navy" x="58" y="99" font-size="37" font-weight="900">MCPでつなぎ、Ontology Kernelで意味を揃え、Agentが安全に仕事を進める</text>
  <text class="jp muted" x="60" y="135" font-size="17" font-weight="650">情報を集めるだけではなく、意味を検証し、根拠を残し、人が承認した仕事だけを正本と業務へ戻す。</text>

  <g class="jp stage">
    <text x="72" y="183" fill="#6B2CBF">01  SOURCES</text>
    <text x="315" y="183" fill="#04AFC4">02  MCP</text>
    <text x="474" y="183" fill="#1785E5">03  BRAINBASE</text>
    <text x="1242" y="183" fill="#FF7A00">04  AGENT LOOP</text>
  </g>

  <!-- Sources -->
  <g filter="url(#shadow)"><rect x="58" y="205" width="230" height="474" rx="24" fill="#FFFFFF" stroke="#D9E1EF" stroke-width="2"/></g>
  <text class="jp navy h2" x="84" y="248">業務の正本</text>
  <text class="jp muted body" x="84" y="273">原文・会話・成果物は残す</text>

  <g>
    <rect x="82" y="303" width="182" height="86" rx="15" fill="#FBF8FF" stroke="#DCCAF4" stroke-width="2"/>
    <rect x="101" y="330" width="43" height="30" rx="4" fill="none" stroke="#6B2CBF" stroke-width="3"/>
    <path d="M102 332 L123 348 L143 332" class="line" stroke="#6B2CBF" stroke-width="3"/>
    <text class="jp navy h3" x="160" y="340">Mail</text><text class="jp muted small" x="160" y="363">相談・依頼・判断</text>
  </g>
  <g>
    <rect x="82" y="406" width="182" height="86" rx="15" fill="#F2FBFD" stroke="#BFEAF0" stroke-width="2"/>
    <circle cx="116" cy="439" r="11" fill="none" stroke="#04AFC4" stroke-width="3"/>
    <path d="M98 469 C100 454 107 449 116 449 C126 449 133 454 135 469" class="line" stroke="#04AFC4" stroke-width="3"/>
    <path d="M137 429 h15 a8 8 0 0 1 8 8 v12 a8 8 0 0 1-8 8 h-6 l-8 7 v-7" class="line" stroke="#04AFC4" stroke-width="3"/>
    <text class="jp navy h3" x="168" y="443">Teams</text><text class="jp muted small" x="168" y="466">会議・チャット</text>
  </g>
  <g>
    <rect x="82" y="509" width="182" height="86" rx="15" fill="#F3F8FF" stroke="#C5DCF5" stroke-width="2"/>
    <path d="M101 538 h18 l7 8 h26 v27 h-51 z" fill="none" stroke="#1785E5" stroke-width="3" stroke-linejoin="round"/><path d="M102 546 h49" class="line" stroke="#1785E5" stroke-width="3"/>
    <text class="jp navy h3" x="168" y="546">Drive</text><text class="jp muted small" x="168" y="569">資料・議事録</text>
  </g>
  <text class="jp muted small" x="84" y="628">repo・業務DB・SaaSも対象</text>
  <text class="jp" x="84" y="651" fill="#6B2CBF" font-size="11" font-weight="800">内容をOntologyへ複製しない</text>

  <!-- MCP -->
  <g filter="url(#shadow)"><rect x="315" y="279" width="126" height="326" rx="28" fill="#071B50"/></g>
  <circle cx="378" cy="334" r="30" fill="#0D2A68" stroke="#04AFC4" stroke-width="2"/>
  <path d="M362 334 h32 M369 324 v20 M387 324 v20" class="line" stroke="#FFFFFF" stroke-width="3"/>
  <text class="jp white" x="378" y="389" text-anchor="middle" font-size="28" font-weight="900">MCP</text>
  <text class="jp" x="378" y="413" text-anchor="middle" fill="#8EE5EF" font-size="12" font-weight="800">Tool Plane</text>
  <line x1="339" y1="436" x2="417" y2="436" stroke="#33508B"/>
  <g class="jp white" font-size="13" font-weight="750" text-anchor="middle"><text x="378" y="470">認証・権限</text><text x="378" y="503">読み取り</text><text x="378" y="536">書き戻し</text><text x="378" y="569">監査可能な接続</text></g>
  <path d="M288 354 H305" class="line" stroke="#6B2CBF" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <path d="M288 451 H305" class="line" stroke="#04AFC4" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <path d="M288 552 H305" class="line" stroke="#1785E5" stroke-width="3" marker-end="url(#arrowNavy)"/>

  <!-- Brainbase boundary -->
  <g filter="url(#shadow)"><rect x="468" y="205" width="736" height="474" rx="28" fill="#FFFFFF" stroke="#BFD0EC" stroke-width="2"/></g>
  <rect x="468" y="205" width="736" height="69" rx="28" fill="#071B50"/><path d="M468 250 V233 Q468 205 496 205 H1176 Q1204 205 1204 233 V250" fill="#071B50"/>
  <text class="jp white" x="500" y="246" font-size="27" font-weight="900">Brainbase</text>
  <text class="jp" x="684" y="244" fill="#A7DDE5" font-size="13" font-weight="750">意味・事実・個人文脈を分けてつなぐ</text>

  <!-- evidence and personal context -->
  <rect x="496" y="302" width="177" height="139" rx="18" fill="#F1FBFC" stroke="#04AFC4" stroke-width="2"/>
  <circle cx="528" cy="336" r="17" fill="#FFFFFF" stroke="#04AFC4" stroke-width="2"/><circle cx="524" cy="332" r="7" fill="none" stroke="#04AFC4" stroke-width="2"/><path d="M529 337 l8 8" class="line" stroke="#04AFC4" stroke-width="2"/>
  <text class="jp navy h3" x="554" y="341">RAG</text>
  <text class="jp muted body" x="514" y="375">原文と出典へ戻る</text>
  <text class="jp muted small" x="514" y="400">会議・文書・メールを検索</text>
  <rect x="514" y="413" width="140" height="20" rx="10" fill="#DDF4F7"/><text class="jp" x="584" y="427" text-anchor="middle" fill="#087F8D" font-size="10.5" font-weight="800">Evidence / Provenance</text>

  <rect x="496" y="463" width="177" height="158" rx="18" fill="#FBF7FF" stroke="#6B2CBF" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="532" cy="503" r="15" fill="none" stroke="#6B2CBF" stroke-width="2.5"/><path d="M504 542 C507 520 518 513 532 513 C546 513 557 520 560 542" class="line" stroke="#6B2CBF" stroke-width="2.5"/>
  <circle cx="573" cy="496" r="6" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="2"/><circle cx="584" cy="520" r="6" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="2"/><path d="M552 513 l21-17 l11 24 l-23 13" class="line" stroke="#6B2CBF" stroke-width="2"/>
  <text class="jp navy" x="585" y="565" text-anchor="middle" font-size="17" font-weight="900">Personal KG</text>
  <text class="jp muted small" x="585" y="588" text-anchor="middle">個人の経験・判断・ローカル文脈</text>
  <text class="jp" x="585" y="609" text-anchor="middle" fill="#6B2CBF" font-size="10.5" font-weight="800">owner-visible／自動昇格しない</text>

  <!-- Ontology Kernel, surrounding Graph access -->
  <rect x="699" y="298" width="477" height="329" rx="22" fill="#FFF9F2" stroke="#FF7A00" stroke-width="3"/>
  <rect x="718" y="313" width="250" height="36" rx="18" fill="#FF7A00"/>

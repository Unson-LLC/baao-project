  <path d="M758 420 L787 402 L819 422 L803 452 L768 449 Z" class="line" stroke="#1785E5" stroke-width="2.4"/>
  <circle cx="758" cy="420" r="6" fill="#FFFFFF" stroke="#1785E5" stroke-width="2"/><circle cx="787" cy="402" r="6" fill="#FFFFFF" stroke="#1785E5" stroke-width="2"/><circle cx="819" cy="422" r="6" fill="#FFFFFF" stroke="#1785E5" stroke-width="2"/><circle cx="803" cy="452" r="6" fill="#FFFFFF" stroke="#1785E5" stroke-width="2"/><circle cx="768" cy="449" r="6" fill="#FFFFFF" stroke="#1785E5" stroke-width="2"/>
  <text class="jp navy" x="818" y="481" text-anchor="middle" font-size="19" font-weight="900">Graph SSOT</text>
  <text class="jp muted small" x="818" y="504" text-anchor="middle">人・組織・案件・Decision・RACI</text>
  <rect x="754" y="511" width="128" height="16" rx="8" fill="#DDEEFF"/><text class="jp" x="818" y="523" text-anchor="middle" fill="#176AB4" font-size="8.8" font-weight="850">承認後にcanonical公開</text>

  <!-- Kernel functions -->
  <g class="jp">
    <rect x="934" y="373" width="105" height="69" rx="14" fill="#FFFFFF" stroke="#FFD0A0" stroke-width="1.5"/>
    <text x="986" y="399" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">意味・型</text><text x="986" y="420" text-anchor="middle" fill="#6B6470" font-size="10.5" font-weight="700">同一性・関係語彙</text>
    <rect x="1051" y="373" width="105" height="69" rx="14" fill="#FFFFFF" stroke="#FFD0A0" stroke-width="1.5"/>
    <text x="1103" y="399" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">書込前検証</text><text x="1103" y="420" text-anchor="middle" fill="#6B6470" font-size="10.5" font-weight="700">制約・dry-run</text>
    <rect x="934" y="454" width="105" height="69" rx="14" fill="#FFFFFF" stroke="#FFD0A0" stroke-width="1.5"/>
    <text x="986" y="480" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">根拠付き推論</text><text x="986" y="501" text-anchor="middle" fill="#6B6470" font-size="10.5" font-weight="700">規則ID・根拠・時刻</text>
    <rect x="1051" y="454" width="105" height="69" rx="14" fill="#FFFFFF" stroke="#FFD0A0" stroke-width="1.5"/>
    <text x="1103" y="480" text-anchor="middle" fill="#B45300" font-size="13" font-weight="900">版・変更管理</text><text x="1103" y="501" text-anchor="middle" fill="#6B6470" font-size="10.5" font-weight="700">適用日・移行・rollback</text>
  </g>


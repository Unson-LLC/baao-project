    <circle cx="899" cy="578" r="12" fill="#FFF0E0"/><path d="M893 572 l12 12 M905 572 l-12 12" class="line" stroke="#D35B00" stroke-width="2"/><text x="918" y="582" fill="#9E4300">違反：拒否・隔離</text>
    <circle cx="1040" cy="578" r="12" fill="#F2EDFA"/><text x="1040" y="582" text-anchor="middle" fill="#6B2CBF">?</text><text x="1059" y="582" fill="#5A3B86">不足：競合・未確認</text>
  </g>
  <text class="jp" x="716" y="649" fill="#B45300" font-size="10.5" font-weight="800">Story: active／受け入れ基準: 未完了／active Ontology version: 未確認</text>

  <!-- context connections -->
  <path d="M441 364 H487" class="line" stroke="#071B50" stroke-width="3.5" marker-end="url(#arrowNavy)"/><text class="jp muted tiny" x="464" y="350" text-anchor="middle">取得</text>
  <path d="M673 368 H690" class="line" stroke="#04AFC4" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <path d="M673 540 H690" class="line" stroke="#6B2CBF" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowNavy)"/><text class="jp" x="681" y="526" text-anchor="middle" fill="#6B2CBF" font-size="9.5" font-weight="800">候補・参照</text>
  <path d="M1204 350 H1226" class="line" stroke="#071B50" stroke-width="3.5" marker-end="url(#arrowNavy)"/><text class="jp muted tiny" x="1215" y="336" text-anchor="middle">文脈</text>
  <path d="M1226 556 H1177" class="line" stroke="#FF7A00" stroke-width="3" marker-end="url(#arrowOrange)"/><text class="jp" x="1202" y="546" text-anchor="middle" fill="#B45300" font-size="10.5" font-weight="850">提案</text>

  <!-- Agent loop -->
  <g filter="url(#shadow)"><rect x="1233" y="205" width="371" height="474" rx="28" fill="#071B50"/></g>
  <text class="jp white" x="1264" y="246" font-size="27" font-weight="900">Agent</text>
  <text class="jp" x="1264" y="270" fill="#A8B9DF" font-size="13" font-weight="750">役割・範囲・Tool・Workflowを持つ</text>
  <rect x="1262" y="302" width="313" height="76" rx="16" fill="#102C68" stroke="#294A89"/>
  <circle cx="1300" cy="340" r="20" fill="#173B7E"/><path d="M1288 344 C1289 328 1298 322 1307 324 C1318 326 1320 341 1312 348 M1292 352 H1308" class="line" stroke="#8EE5EF" stroke-width="2.5"/>
  <text class="jp white h3" x="1334" y="335">Role Agent</text><text class="jp" x="1334" y="359" fill="#B9C7E4" font-size="12" font-weight="700">誰が・どの組織で・何を使えるか</text>

  <g class="jp">
    <rect x="1262" y="397" width="92" height="72" rx="14" fill="#102C68" stroke="#294A89"/><text x="1308" y="425" text-anchor="middle" fill="#8EE5EF" font-size="12" font-weight="850">調査</text><text x="1308" y="447" text-anchor="middle" fill="#B9C7E4" font-size="10.5" font-weight="700">根拠を集める</text>
    <rect x="1371" y="397" width="92" height="72" rx="14" fill="#102C68" stroke="#294A89"/><text x="1417" y="425" text-anchor="middle" fill="#C6AAF1" font-size="12" font-weight="850">判断支援</text><text x="1417" y="447" text-anchor="middle" fill="#B9C7E4" font-size="10.5" font-weight="700">論点を整理</text>
    <rect x="1480" y="397" width="95" height="72" rx="14" fill="#102C68" stroke="#294A89"/><text x="1528" y="425" text-anchor="middle" fill="#FFB25B" font-size="12" font-weight="850">提案・実行</text><text x="1528" y="447" text-anchor="middle" fill="#B9C7E4" font-size="10.5" font-weight="700">候補をつくる</text>
  </g>
  <rect x="1262" y="489" width="313" height="76" rx="16" fill="#132F68" stroke="#3B5C99"/>
  <text class="jp white" x="1286" y="518" font-size="16" font-weight="900">Automation Run</text>
  <text class="jp" x="1286" y="542" fill="#B9C7E4" font-size="11.5" font-weight="700">step・state・retry・output・audit</text>
  <path d="M1472 527 h67" class="line" stroke="#8FA7D5" stroke-width="2"/><circle cx="1480" cy="527" r="5" fill="#04AFC4"/><circle cx="1507" cy="527" r="5" fill="#6B2CBF"/><circle cx="1534" cy="527" r="5" fill="#FF7A00"/>

  <rect x="1262" y="584" width="313" height="65" rx="16" fill="#FFF5E8" stroke="#FF7A00" stroke-width="2"/>
  <path d="M1287 617 l7 7 l15-19" class="line" stroke="#FF7A00" stroke-width="2.8"/>
  <text class="jp" x="1322" y="610" fill="#9E4300" font-size="14" font-weight="900">Human Gate</text>
  <text class="jp" x="1322" y="632" fill="#A66B3F" font-size="11" font-weight="750">承認者・resolution・監査を記録</text>

  <!-- write back from Agent through MCP to sources -->
  <path d="M1418 679 V704 H378 V616" class="line" stroke="#FF7A00" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowOrange)"/>
  <path d="M315 704 H173 V688" class="line" stroke="#FF7A00" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowOrange)"/>
  <rect x="676" y="684" width="400" height="39" rx="20" fill="#FFF8F0" stroke="#FFD2A5"/>
  <text class="jp" x="876" y="708" text-anchor="middle" fill="#B64D00" font-size="13" font-weight="850">承認後：Mail送信／Teams投稿／Drive更新／タスク登録</text>

  <!-- ontology change lifecycle -->
  <text class="jp navy" x="58" y="762" font-size="16" font-weight="900">Ontology変更は、提案から公開まで証跡を残す</text>
  <line x1="58" y1="793" x2="1605" y2="793" stroke="#CBD5E6" stroke-width="1.5"/>
  <g class="jp">
    <circle cx="186" cy="793" r="12" fill="#FFFFFF" stroke="#6B2CBF" stroke-width="3"/><text x="186" y="799" text-anchor="middle" fill="#6B2CBF" font-size="13" font-weight="900">1</text>
    <text x="186" y="827" text-anchor="middle" fill="#071B50" font-size="13" font-weight="850">規則を提案</text>
    <path d="M199 793 H428" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <circle cx="445" cy="793" r="12" fill="#FFFFFF" stroke="#1785E5" stroke-width="3"/><text x="445" y="799" text-anchor="middle" fill="#1785E5" font-size="13" font-weight="900">2</text>
    <text x="445" y="827" text-anchor="middle" fill="#071B50" font-size="13" font-weight="850">Impact Report</text>
    <path d="M458 793 H720" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <circle cx="737" cy="793" r="12" fill="#FFFFFF" stroke="#FF7A00" stroke-width="3"/><text x="737" y="799" text-anchor="middle" fill="#FF7A00" font-size="13" font-weight="900">3</text>
    <text x="737" y="827" text-anchor="middle" fill="#071B50" font-size="13" font-weight="850">Decision / RACI承認</text>
    <path d="M750 793 H1041" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <circle cx="1058" cy="793" r="12" fill="#FFFFFF" stroke="#04AFC4" stroke-width="3"/><text x="1058" y="799" text-anchor="middle" fill="#04AFC4" font-size="13" font-weight="900">4</text>
    <text x="1058" y="827" text-anchor="middle" fill="#071B50" font-size="13" font-weight="850">active version公開</text>
    <path d="M1071 793 H1370" class="line" stroke="#071B50" stroke-width="2" marker-end="url(#arrowNavy)"/>
    <circle cx="1387" cy="793" r="12" fill="#FFFFFF" stroke="#071B50" stroke-width="3"/><text x="1387" y="799" text-anchor="middle" fill="#071B50" font-size="13" font-weight="900">5</text>
    <text x="1387" y="827" text-anchor="middle" fill="#071B50" font-size="13" font-weight="850">移行／rollback</text>
  </g>

  <!-- bottom statement -->
  <circle cx="84" cy="881" r="22" fill="#071B50"/><path d="M75 882 l6 6 l13-17" class="line" stroke="#FFFFFF" stroke-width="3"/>
  <text class="jp navy" x="119" y="875" font-size="19" font-weight="900">Ontologyは知識を置く箱ではない。</text>
  <text class="jp" x="119" y="901" fill="#344260" font-size="16" font-weight="750">事実を同じ意味で解釈し、誤った関係を正本へ入れず、判断を再現するための契約である。</text>
</svg>

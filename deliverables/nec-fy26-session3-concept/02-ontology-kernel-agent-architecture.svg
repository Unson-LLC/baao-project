  <path d="M1051 548 H934" class="line" stroke="#FF7A00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text class="jp" x="993" y="542" text-anchor="middle" fill="#B45300" font-size="10.5" font-weight="850">Agent proposal → validate</text>
  <rect x="724" y="552" width="432" height="53" rx="13" fill="#FFFFFF" stroke="#FFD0A0"/>
  <g class="jp" font-size="10.5" font-weight="850">
